name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EQX_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the retired "tools" package, which newer
          # sdkmanager versions can no longer find. Install only what this project needs.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EquinoxTrack-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Optional signed release -------------------------------------------------------
      # Add these repository secrets to enable it (Settings > Secrets and variables > Actions):
      #   EQX_KEYSTORE_BASE64   base64 of your .jks keystore  (base64 -w0 release.jks)
      #   EQX_KEYSTORE_PASSWORD keystore password
      #   EQX_KEY_ALIAS         key alias
      #   EQX_KEY_PASSWORD      key password (optional, defaults to the keystore password)
      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.EQX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "EQX_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets configured; skipping the signed release build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          EQX_KEYSTORE_PASSWORD: ${{ secrets.EQX_KEYSTORE_PASSWORD }}
          EQX_KEY_ALIAS: ${{ secrets.EQX_KEY_ALIAS }}
          EQX_KEY_PASSWORD: ${{ secrets.EQX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EquinoxTrack-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
